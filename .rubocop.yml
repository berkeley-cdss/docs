require:
  - rubocop-rspec
  - rubocop-capybara

AllCops:
  NewCops: enable

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Max: 100

Metrics/PerceivedComplexity:
  Enabled: false

# spec_summary.rb prints the a11y test summary to the CI log on purpose.
RSpec/Output:
  Exclude:
    - spec/support/spec_summary.rb
