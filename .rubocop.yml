require:
  - rubocop-rspec
  - rubocop-capybara

AllCops:
  NewCops: enable

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Max: 100

Metrics/PerceivedComplexity:
  Enabled: false

# Helpers that report on the site build and the a11y results in the CI log.
RSpec/Output:
  Exclude:
    - spec/support/**/*.rb
